name: Tag Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-tags-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release bump from merged PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const baseBranch = context.ref.replace('refs/heads/', '');
            const attempts = 12;
            const retryDelayMs = 10000;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function findMergedPR() {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: commitSha,
                  per_page: 100,
                },
                (response) => response.data,
              );

              let pr = associated.find((item) => item.merged_at) || associated[0];
              if (pr) {
                return { pr, source: 'commit-association' };
              }

              const recentClosed = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: 'closed',
                  base: baseBranch,
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100,
                },
                (response) => response.data,
              );

              pr = recentClosed.find((item) => item.merged_at && item.merge_commit_sha === commitSha);
              if (pr) {
                return { pr, source: 'recent-closed-prs' };
              }

              return null;
            }

            let match = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              match = await findMergedPR();
              if (match) {
                core.notice(`Resolved PR #${match.pr.number} via ${match.source} on attempt ${attempt}/${attempts}.`);
                break;
              }

              if (attempt < attempts) {
                core.notice(`No merged PR found for commit ${commitSha} on attempt ${attempt}/${attempts}; retrying in ${retryDelayMs / 1000}s.`);
                await sleep(retryDelayMs);
              }
            }

            if (!match) {
              core.setFailed(`Unable to resolve a merged PR for commit ${commitSha} after ${attempts} attempts.`);
              return;
            }

            const pr = match.pr;
            const labels = (pr.labels || []).map((label) => label.name);
            const allowed = ['release/patch', 'release/minor', 'release/major'];
            const releaseLabels = labels.filter((label) => allowed.includes(label));
            if (releaseLabels.length !== 1) {
              const found = releaseLabels.length ? releaseLabels.join(', ') : 'none';
              core.setFailed(`PR #${pr.number} must have exactly one release label: ${allowed.join(', ')}. Found: ${found}`);
              return;
            }

            const level = releaseLabels[0].replace('release/', '');
            core.setOutput('level', level);
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);

      - name: Check current commit release tag
        id: tag-state
        shell: bash
        run: |
          existing="$(git tag --points-at HEAD -l 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "${existing}" ]; then
            echo "Tag ${existing} already points at this commit, nothing to do."
            echo "create=false" >> "${GITHUB_OUTPUT}"
            echo "tag=${existing}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "create=true" >> "${GITHUB_OUTPUT}"

      - name: Verify release token
        if: steps.tag-state.outputs.create == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "GH_PAT is required to push release tags from this workflow." >&2
            echo "Provide a fine-grained personal access token with Contents: Read and write via the GH_PAT Actions secret." >&2
            exit 1
          fi

      - name: Create and push tag
        if: steps.tag-state.outputs.create == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RELEASE_PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_PR_TITLE: ${{ steps.pr.outputs.title }}
          RELEASE_LEVEL: ${{ steps.pr.outputs.level }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github@pb33f.io"

          compute_next_tag() {
            latest="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"
            if [ -z "${latest}" ]; then
              latest="v$(node -p "require('./package.json').version")"
            fi

            version="${latest#v}"
            IFS='.' read -r major minor patch <<<"${version}"

            case "${RELEASE_LEVEL}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unknown release level: ${RELEASE_LEVEL}" >&2
                exit 1
                ;;
            esac

            echo "v${major}.${minor}.${patch}"
          }

          remote="https://${GITHUB_ACTOR}:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags "${remote}"

          existing="$(git tag --points-at HEAD -l 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "${existing}" ]; then
            echo "Tag ${existing} already points at this commit, nothing to do."
            exit 0
          fi

          tag="$(compute_next_tag)"
          tag_message="${tag}: PR #${RELEASE_PR_NUMBER} ${RELEASE_PR_TITLE}"
          git tag -a "${tag}" -m "${tag_message}"
          git push "${remote}" "${tag}"
